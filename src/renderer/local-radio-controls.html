<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>WaveDeck Opus Local Radio Controls</title>
  <link rel="stylesheet" href="./local-radio-controls.css" />
</head>
<body>
  <main class="wrap">
    <section class="controls-card">
      <label class="preference-toggle">
        <input id="localMusicCrossfade" type="checkbox" />
        <span class="toggle-switch" aria-hidden="true"></span>
        <span>Enable Crossfade</span>
      </label>

      <div class="divider"></div>

      <label class="preference-toggle">
        <input id="localMixFavorLastFm" type="checkbox" />
        <span class="toggle-switch" aria-hidden="true"></span>
        <span>Favor Last.fm Data for Local Mixes</span>
      </label>

      <div class="divider"></div>

      <div class="control">
        <label for="localRadioFamiliarity">Song familiarity</label>
        <input id="localRadioFamiliarity" type="range" min="0" max="2" step="1" value="1" />
        <div class="stops three" aria-hidden="true"><span>Play Deep Cuts Too</span><span>Balanced Mix</span><span>Favor the Hits</span></div>
      </div>

      <div class="control">
        <label for="localRadioSongRepeat">Don't play the same song for how long?</label>
        <input id="localRadioSongRepeat" type="range" min="1" max="24" step="1" value="4" />
        <div class="song-repeat-value" aria-hidden="true"><output id="localRadioSongRepeatValue"></output></div>
      </div>

      <div class="control">
        <label for="localRadioArtistRepeat">Don't play the same artist for how long?</label>
        <input id="localRadioArtistRepeat" type="range" min="0" max="4" step="1" value="2" />
        <div class="stops five" aria-hidden="true"><span>30 min</span><span>60 min</span><span>90 min</span><span>120 min</span><span>180 min</span></div>
      </div>

      <div class="control">
        <label for="localRadioArtistSet">Artist sets</label>
        <input id="localRadioArtistSet" type="range" min="0" max="3" step="1" value="0" />
        <div class="stops four" aria-hidden="true"><span>Single Tracks</span><span>Two-fers</span><span>Three-way</span><span>Four-play</span></div>
      </div>
    </section>
    <div id="status" class="status" role="status"></div>
  </main>
  <script src="./local-radio-controls.js"></script>
</body>
</html>
