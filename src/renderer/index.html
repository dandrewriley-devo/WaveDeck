<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>WaveDeck</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="app">
    <header class="header">
      <img class="logo" src="../../assets/logo.png" alt="WaveDeck logo">
      <div class="station-name">WaveDeck</div>
      <div class="now-playing" id="nowPlaying">Warming up the airwaves...</div>

      <div class="volume-row">
        <input id="volSlider" type="range" min="0" max="100" value="100" aria-label="Volume" />
        <button id="muteBtn" aria-label="Toggle mute" title="Mute">
          <svg id="muteIcon" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
               viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M8.25 6.75 4.5 9H2.25A.75.75 0 0 0 1.5 9.75v4.5c0 .414.336.75.75.75H4.5l3.75 2.25V6.75Z"/>
            <path d="M14.75 8.75a.75.75 0 0 1 1.06 0 4.5 4.5 0 0 1 0 6.364.75.75 0 1 1-1.06-1.06 3 3 0 0 0 0-4.244.75.75 0 0 1 0-1.06Z"/>
            <path d="M17.5 6a.75.75 0 0 1 1.06 0 8.25 8.25 0 0 1 0 12 .75.75 0 1 1-1.06-1.06 6.75 6.75 0 0 0 0-9.88.75.75 0 0 1 0-1.06Z"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabbar" aria-label="WaveDeck sections">
      <button id="streamingTabBtn" class="tab-button active" type="button" aria-pressed="true">Streaming</button>
      <button id="musicToggleBtn" class="tab-button" data-pro-only type="button" aria-pressed="false" hidden>Local Music</button>
      <span class="tabbar-spacer" aria-hidden="true"></span>
      <button id="openSettingsBtn" class="settings-tab" type="button" aria-label="Open settings" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/>
        </svg>
      </button>
    </nav>

    <nav class="toolbar" aria-label="Current section tools">
      <div id="streamingToolbar" class="toolbar-group">
      <button id="presetSectionToggleBtn" class="active" type="button" aria-label="Hide Presets"
              aria-pressed="true" title="Presets">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 4.25c0-.69.56-1.25 1.25-1.25h8.5c.69 0 1.25.56 1.25 1.25V21L12 17.35 6.5 21V4.25Z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="favoritesOnlyToggleBtn" data-pro-only type="button" aria-label="Show Favorites only"
              aria-pressed="false" title="Favorites Only" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 3 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.92 1.06-6.2L3 9.53l6.22-.9L12 3Z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="mostPlayedSectionToggleBtn" data-pro-only type="button" aria-label="Show Your Top Five"
              aria-pressed="false" title="Your Top Five" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5h16M3 10h5M3 15h3" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="15.5" cy="14.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M15.5 11.5v3.2l2.2 1.4" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="recordingsSectionToggleBtn" data-pro-only type="button" aria-label="Open Recordings"
              aria-pressed="false" title="Recordings" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="4" width="17" height="16" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="m10 8.5 5 3.5-5 3.5z" fill="currentColor"/>
          <path d="M7 17h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      </div>
      <div id="localMusicToolbar" class="toolbar-group local-music-toolbar" hidden>
        <span id="musicStatus" class="music-toolbar-status" role="status"></span>
        <span id="musicContext" class="music-toolbar-context" aria-label="Current local music selection" hidden><span id="musicContextLabel"></span></span>
        <button id="musicRescan" type="button" aria-label="Rescan Local Music" title="Rescan Local Music">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0 2.1 5.4M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <span class="toolbar-spacer" aria-hidden="true"></span>
      <button id="sidebarModeBtn" type="button" aria-label="Turn Sidebar Mode on"
              aria-pressed="false" title="Sidebar Mode">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M15 5h5v14h-5z" fill="currentColor"/>
        </svg>
      </button>
    </nav>

    <div class="transport" aria-label="Playback controls">
      <button id="previousPresetBtn" data-pro-only type="button" aria-label="Previous Preset" title="Previous Preset" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 5v14M18 6.5 9 12l9 5.5z" fill="currentColor"/>
        </svg>
      </button>
      <button id="playPauseBtn" data-pro-only type="button" aria-label="Play" title="Play" hidden>
        <svg id="playPauseIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" fill="currentColor"/></svg>
      </button>
      <button id="recordBtn" data-pro-only type="button" aria-label="Start recording" title="Record" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="currentColor"/></svg>
      </button>
      <button id="stopBtn" aria-label="Stop playback" title="Stop">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button id="nextPresetBtn" data-pro-only type="button" aria-label="Next Preset" title="Next Preset" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6.5l9 5.5-9 5.5z" fill="currentColor"/></svg>
      </button>
      <span class="transport-spacer" aria-hidden="true"></span>
      <button id="localThumbUpBtn" class="feedback-button" type="button" aria-label="Local Radio thumbs up" title="Local Radio thumbs up" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 10.5v9H4.75a1.25 1.25 0 0 1-1.25-1.25v-6.5A1.25 1.25 0 0 1 4.75 10.5H7.5Zm0 9h8.4a2 2 0 0 0 1.95-1.55l1.3-5.5A2 2 0 0 0 17.2 10H13l.5-3.1a2.55 2.55 0 0 0-2.5-2.9L7.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <button id="localThumbDownBtn" class="feedback-button" type="button" aria-label="Local Radio thumbs down" title="Local Radio thumbs down" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 13.5v-9H4.75A1.25 1.25 0 0 0 3.5 5.75v6.5a1.25 1.25 0 0 0 1.25 1.25H7.5Zm0-9h8.4a2 2 0 0 1 1.95 1.55l1.3 5.5A2 2 0 0 1 17.2 14H13l.5 3.1a2.55 2.55 0 0 1-2.5 2.9l-3.5-6.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <section id="searchPanel" class="station-search-panel" aria-label="Station search" hidden>
      <div class="station-search-field">
        <input id="stationSearchInput" class="station-search-input" type="search"
               placeholder="Search stations…" autocomplete="off" spellcheck="false"
               aria-label="Search stations" />
        <button id="clearStationSearchBtn" class="station-search-clear" type="button"
                aria-label="Clear station search" title="Clear search" hidden>×</button>
      </div>
    </section>

    <section id="recordingsPanel" class="station-search-panel" aria-label="Search recordings" hidden>
      <div class="station-search-field">
        <input id="recordingSearchInput" class="station-search-input" type="search"
               placeholder="Search recordings…" autocomplete="off" spellcheck="false"
               aria-label="Search recordings" />
        <button id="clearRecordingSearchBtn" class="station-search-clear" type="button"
                aria-label="Clear recordings search" title="Clear search" hidden>×</button>
      </div>
    </section>

    <section id="musicPanel" class="station-search-panel" aria-label="Local music search" hidden>
      <div class="station-search-field">
        <input id="musicSearch" class="station-search-input" type="search" placeholder="Search your music…" aria-label="Search local music" autocomplete="off">
        <button id="clearMusicSearchBtn" class="station-search-clear" type="button"
                aria-label="Clear music search" title="Clear search" hidden>×</button>
      </div>
    </section>
    <main class="list"></main>

  </div>

  <script src="./search.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
