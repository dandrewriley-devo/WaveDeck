<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';"><link rel="stylesheet" href="./auto-dj-ids.css"><title>Station IDs</title></head><body><main><h1>Station IDs</h1><p>Write up to 50 IDs. Use <code>[station]</code> and <code>[dj]</code>. Add <code>[xl]</code> to an ID to play a random extra line after it. Blank lines are ignored.</p><div id="rows"></div><h2>Extra Lines</h2><p>Up to 40 short lines. A marked ID picks one ready line at random before the next song intro.</p><div id="extras"></div><div class="actions"><span id="status"></span><button id="save">Save IDs and Extra Lines</button></div></main><script src="./auto-dj-ids.js"></script></body></html>
