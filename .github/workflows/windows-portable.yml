name: Build portable releases

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build and inspect Windows Sidebar helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/windows/bin | Out-Null
          cl /nologo /O2 /W4 /MT /Fe:native\windows\bin\WaveDeckSidebar.exe native\windows\WaveDeckSidebar.c /link user32.lib shell32.lib
          if (-not (Test-Path native/windows/bin/WaveDeckSidebar.exe)) {
            throw "The Windows Sidebar helper was not created."
          }
          $helperCheck = Start-Process `
            -FilePath native/windows/bin/WaveDeckSidebar.exe `
            -Wait `
            -PassThru `
            -NoNewWindow
          if ($helperCheck.ExitCode -ne 2) {
            throw "The Windows Sidebar helper did not return its expected usage result."
          }

      - name: Download pinned Windows mpv
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpv.7z"
          Invoke-WebRequest "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-x86_64-20260903-git-69e63f425a.7z" -OutFile $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($archiveHash -ne "418dbfb5feb851cbed33d6c05d8481ba71802621bfd6efe8974522b28d42ac97") {
            throw "The downloaded mpv archive did not match the pinned SHA-256."
          }
          New-Item -ItemType Directory -Force playback/win32 | Out-Null
          & 7z e $archive -oplayback/win32 mpv.exe -r -y
          $mpvHash = (Get-FileHash playback/win32/mpv.exe -Algorithm SHA256).Hash.ToLower()
          if ($mpvHash -ne "4a0bc712bc98e6f80cd980930b74b6ac202b8ccf2041e887adab69906f82731c") {
            throw "The extracted mpv.exe did not match the pinned SHA-256."
          }

      # WaveDeck intentionally does not use a standard npm lockfile. Keep it
      # untouched and install the pinned manifest dependencies for the build.
      - run: npm install --package-lock=false --no-audit --no-fund
      # The full validator checks a POSIX executable permission bit; the Linux
      # build covers that assertion. This is the portable music regression suite.
      - run: node scripts/test-music.js
      - run: npm run dist:windows -- --publish never

      - name: Inspect portable EXE
        shell: pwsh
        run: |
          $exe = "dist/windows/WaveDeck.exe"
          if (-not (Test-Path $exe)) { throw "WaveDeck.exe was not created." }
          $size = (Get-Item $exe).Length
          if ($size -lt 100MB) { throw "WaveDeck.exe is unexpectedly small: $size bytes." }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "WaveDeck.exe size: $size bytes"
          "WaveDeck.exe SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: WaveDeck-1.0.5-Windows
          path: dist/windows/WaveDeck.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # WaveDeck intentionally does not use a standard npm lockfile. Keep it
      # untouched and install the pinned manifest dependencies for the build.
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run dist:linux -- --publish never

      - name: Inspect AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/WaveDeck.AppImage"
          chmod 755 "$appimage"
          test -f "$appimage"
          test -x "$appimage"
          size=$(stat --format=%s "$appimage")
          if [ "$size" -lt 100000000 ]; then
            echo "WaveDeck.AppImage is unexpectedly small: $size bytes."
            exit 1
          fi
          sha256sum "$appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: WaveDeck-1.0.5-Linux
          path: dist/WaveDeck.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WaveDeck-1.0.5-Linux
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: WaveDeck-1.0.5-Windows
          path: release-assets/windows

      - name: Inspect release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/linux/WaveDeck.AppImage
          test -f release-assets/windows/WaveDeck.exe
          sha256sum release-assets/linux/WaveDeck.AppImage release-assets/windows/WaveDeck.exe

      - name: Publish WaveDeck 1.0.5 for Linux and Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          target_commitish: ${{ github.sha }}
          name: WaveDeck 1.0.5
          body: Portable Linux x64 and Windows x64 builds. Keep WaveDeck.AppImage or WaveDeck.exe beside your existing Data and Music folders.
          files: |
            release-assets/linux/WaveDeck.AppImage
            release-assets/windows/WaveDeck.exe
          overwrite_files: true
          fail_on_unmatched_files: true
