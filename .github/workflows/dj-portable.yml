name: Build WaveDeck DJ

on:
  workflow_dispatch:
  push:
    branches: [dj-portable]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y icecast2
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run dist:linux -- --publish never
      - name: Inspect WaveDeck DJ AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/WaveDeckDJ.AppImage"
          chmod 755 "$appimage"
          test -f "$appimage"
          test -x "$appimage"
          size=$(stat --format=%s "$appimage")
          if [ "$size" -lt 100000000 ]; then
            echo "WaveDeckDJ.AppImage is unexpectedly small: $size bytes."
            exit 1
          fi
          sha256sum "$appimage"
      - name: Verify packaged DJ voice
        shell: bash
        run: |
          set -euo pipefail
          appimage="$GITHUB_WORKSPACE/dist/WaveDeckDJ.AppImage"
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          (
            cd "$workdir"
            "$appimage" --appimage-extract >/dev/null
          )
          appdir="$workdir/squashfs-root"
          NODE_PATH="$appdir/resources/app.asar/node_modules" ELECTRON_RUN_AS_NODE=1 "$appdir/wavedeck-dj" "$GITHUB_WORKSPACE/scripts/verify-dj-voice-runtime.js" "$appdir"
      - uses: actions/upload-artifact@v4
        with:
          name: WaveDeckDJ-0.1.5-Linux
          path: dist/WaveDeckDJ.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WaveDeckDJ-0.1.5-Linux
          path: release-assets
      - name: Inspect release asset
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/WaveDeckDJ.AppImage
          sha256sum release-assets/WaveDeckDJ.AppImage
      - name: Publish WaveDeck DJ 0.1.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dj-v0.1.5
          target_commitish: ${{ github.sha }}
          name: WaveDeck DJ 0.1.5
          body: "Linux x64 WaveDeck DJ. Adds an adjustable 1–60 minute Auto DJ break interval (15 by default) and prevents an in-progress next-song preparation from crossfading past an eligible break. Existing DJ clips and portable data stay intact."
          files: release-assets/WaveDeckDJ.AppImage
          overwrite_files: true
          fail_on_unmatched_files: true
