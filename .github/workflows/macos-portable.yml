name: Build universal macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Download pinned standalone mpv bundles
        shell: bash
        run: |
          set -euo pipefail

          arm_archive="$RUNNER_TEMP/mpv-arm64-0.40.0.tar.gz"
          intel_archive="$RUNNER_TEMP/mpv-intel-0.39.0.tar.gz"
          arm_extract="$RUNNER_TEMP/mpv-arm64"
          intel_extract="$RUNNER_TEMP/mpv-intel"

          curl --fail --location --retry 3 \
            "https://laboratory.stolendata.net/~djinn/mpv_osx/mpv-arm64-0.40.0.tar.gz" \
            --output "$arm_archive"
          curl --fail --location --retry 3 \
            "https://laboratory.stolendata.net/~djinn/mpv_osx/mpv-0.39.0.tar.gz" \
            --output "$intel_archive"

          echo "3170fb709defebaba33e9755297d70dc3562220541de54fc3d494a8309ef1260  $arm_archive" | shasum -a 256 --check
          echo "35ec81ad86a97b24956a8d0f4fa1ba2690b44ae7741c920e923620bcd7bd402a  $intel_archive" | shasum -a 256 --check

          mkdir -p "$arm_extract" "$intel_extract" playback/darwin/arm64 playback/darwin/x64
          tar -xzf "$arm_archive" -C "$arm_extract"
          tar -xzf "$intel_archive" -C "$intel_extract"

          arm_app="$(find "$arm_extract" -type d -name mpv.app -print -quit)"
          intel_app="$(find "$intel_extract" -type d -name mpv.app -print -quit)"
          test -n "$arm_app"
          test -n "$intel_app"
          ditto "$arm_app" playback/darwin/arm64/mpv.app
          ditto "$intel_app" playback/darwin/x64/mpv.app

          arm_binary="playback/darwin/arm64/mpv.app/Contents/MacOS/mpv"
          intel_binary="playback/darwin/x64/mpv.app/Contents/MacOS/mpv"
          test -x "$arm_binary"
          test -x "$intel_binary"
          lipo -archs "$arm_binary" | grep -qw arm64
          lipo -archs "$intel_binary" | grep -qw x86_64

          if otool -L "$arm_binary" "$intel_binary" | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "A bundled mpv engine still depends on a Homebrew path."
            exit 1
          fi

      - name: Build universal WaveDeck app
        run: npm run dist:macos -- --publish never

      - name: Ad-hoc sign and verify application
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist/macos -type d -name WaveDeck.app -print -quit)"
          test -n "$app_path"

          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          app_binary="$app_path/Contents/MacOS/WaveDeck"
          app_arches="$(lipo -archs "$app_binary")"
          echo "WaveDeck architectures: $app_arches"
          grep -qw arm64 <<< "$app_arches"
          grep -qw x86_64 <<< "$app_arches"

          arm_mpv="$app_path/Contents/Resources/playback/darwin/arm64/mpv.app/Contents/MacOS/mpv"
          intel_mpv="$app_path/Contents/Resources/playback/darwin/x64/mpv.app/Contents/MacOS/mpv"
          test -x "$arm_mpv"
          test -x "$intel_mpv"
          lipo -archs "$arm_mpv" | grep -qw arm64
          lipo -archs "$intel_mpv" | grep -qw x86_64

          mkdir -p release
          ditto "$app_path" release/WaveDeck.app
          cp START-HERE-MACOS.txt release/START-HERE-MACOS.txt
          ditto -c -k --sequesterRsrc release WaveDeck-0.4.3-macOS-Universal.zip

          unzip -t WaveDeck-0.4.3-macOS-Universal.zip
          unzip -Z1 WaveDeck-0.4.3-macOS-Universal.zip | grep -q '^WaveDeck.app/'
          unzip -Z1 WaveDeck-0.4.3-macOS-Universal.zip | grep -q '^START-HERE-MACOS.txt$'
          if unzip -Z1 WaveDeck-0.4.3-macOS-Universal.zip | grep -Eq '(^|/)Data(/|$)'; then
            echo "The macOS test ZIP must not contain a Data folder."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WaveDeck-0.4.3-macOS-Universal
          path: WaveDeck-0.4.3-macOS-Universal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
