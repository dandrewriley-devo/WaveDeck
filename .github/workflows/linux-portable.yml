name: Build Linux portable release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux -- --publish never

      - name: Assemble Linux portable folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release/WaveDeck Portable"
          install -m 755 dist/WaveDeck.AppImage "release/WaveDeck Portable/WaveDeck.AppImage"
          install -m 644 defaults/library.json "release/WaveDeck Portable/WaveDeck-Default-Library.json"
          install -m 644 START-HERE.txt "release/WaveDeck Portable/START-HERE.txt"
          install -m 644 README-SOURCE.txt "release/WaveDeck Portable/README-SOURCE.txt"
          install -m 644 LICENSE "release/WaveDeck Portable/LICENSE"
          install -m 644 THIRD-PARTY-NOTICES.txt "release/WaveDeck Portable/THIRD-PARTY-NOTICES.txt"
          install -m 644 licenses/mpv-GPL-2.0.txt "release/WaveDeck Portable/mpv-GPL-2.0.txt"
          cd release
          zip -q -r -9 WaveDeck-0.6.5-Linux.zip "WaveDeck Portable"
          unzip -t WaveDeck-0.6.5-Linux.zip
          zipinfo -l WaveDeck-0.6.5-Linux.zip | grep -Eq '^-rwxr-xr-x .*WaveDeck Portable/WaveDeck.AppImage$'
          if unzip -Z1 WaveDeck-0.6.5-Linux.zip | grep -Eq '^WaveDeck Portable/Data(/|$)'; then
            echo "The release ZIP must not contain a Data folder."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WaveDeck-0.6.5-Linux
          path: release/WaveDeck-0.6.5-Linux.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
